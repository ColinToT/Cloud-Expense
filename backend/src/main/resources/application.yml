spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloud_expense
    username: app_user
    password: 123456

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

file:
  storage-path: uploads
  access-path: /uploads
  max-size: 10MB
  max-count-per-expense: 5
  allowed-types:
      - image/jpeg
      - image/png
      - application/pdf